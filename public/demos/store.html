      '<div><small>' + t('status') + '</small><span class="stp">' + t('pending') + '</span><small style="margin-top:8px">' + t('payBy') + '</small><b>' + esc(payName) + (O.trx ? ' · ' + esc(O.trx) : '') + '</b></div></div>' +
      '<table class="tbl"><tr><th>' + t('item') + '</th><th>' + t('qty') + '</th><th>' + t('price') + '</th><th style="text-align:right">' + t('amount') + '</th></tr>' + O.items.map(function (i) { return '<tr><td><b>' + esc(i.name) + '</b>' + (i.opt ? '<br><small>' + esc(i.opt) + '</small>' : '') + '</td><td>' + i.q + '</td><td>' + tk(i.price) + '</td><td style="text-align:right">' + tk(i.price * i.q) + '</td></tr>'; }).join('') + '</table>' +
      '<div class="tot" style="max-width:320px;margin-left:auto"><div><span>' + t('subtotal') + '</span><b>' + tk(O.sub) + '</b></div><div><span>' + t('delCharge') + ' (' + (O.zone === 'inside' ? t('inside') : t('outside')) + ')</span><b>' + tk(O.del) + '</b></div><div class="big"><span>' + t('total') + '</span><b>' + tk(O.total) + '</b></div>' + (O.pay === 'cod' ? '<div><span>' + t('toCollect') + '</span><b style="color:#dc2626">' + tk(O.total) + '</b></div>' : '') + '</div>' +
      '<p class="small" style="text-align:center;margin-top:16px">7-day easy return or exchange with this invoice · Made with ROSE Store Builder</p></div>' +
      '<div class="invb noprint"><button class="btn" onclick="window.print()">⬇️ ' + t('download') + '</button><a class="btn alt" href="#/account">📦 ' + t('myOrders') + '</a><a class="btn alt" href="#/">🏠 ' + t('keepShop') + '</a></div>';
  }

  // ---------------- account + login ----------------
  function account() {
    var list = myOrders();
    var orders = '<h4 style="margin:16px 0 4px">' + t('myOrders') + '</h4>' + (list.length ? list.map(function (o) { return '<a class="row" href="#/invoice/' + o.no + '"><span class="e">📦</span><div style="flex:1"><b>#' + o.no + ' · ' + tk(o.total) + '</b><div style="font-size:12px;color:#64748b">' + new Date(o.date).toLocaleDateString('en-GB') + ' · ' + t('pending') + '</div></div><span style="color:var(--c);font-weight:700">' + t('invoice') + ' ›</span></a>'; }).join('') : '<p class="small">No orders yet.</p>');
    if (!cust.email) return '<div class="panel" style="max-width:520px;margin:0 auto"><h3 style="margin-top:0">👤 ' + t('account') + '</h3><div class="authb" style="grid-template-columns:1fr">' + '<button class="btn gbtn" onclick="openAuth(\'google\')">G ' + t('google') + '</button><button class="btn alt" onclick="openAuth(\'login\')">✉️ ' + t('emailLogin') + '</button><button class="btn alt" onclick="openAuth(\'signup\')">➕ Create account</button></div><p class="small">✓ ' + t('guest') + '</p>' + orders + '</div>';
    return '<div class="panel" style="max-width:620px;margin:0 auto"><div class="acct"><div class="ravatar" style="width:52px;height:52px;font-size:22px">' + esc((cust.name || cust.email).charAt(0).toUpperCase()) + '</div><div style="flex:1"><b style="font-size:17px">' + esc(cust.name || 'Customer') + '</b><div class="small">' + esc(cust.email) + '</div></div><button class="btn alt" style="width:auto" onclick="logoutCust()">' + t('logout') + '</button></div>' +
      '<h4 style="margin:16px 0 4px">📍 ' + t('address') + '</h4><p class="small" style="margin:0">' + (cust.address ? esc(cust.address + ', ' + cust.upazila + ', ' + cust.district + ', ' + cust.division) + '<br>📞 ' + esc(cust.phone || '') : 'Your address is saved after your first order.') + '</p>' + orders + '</div>';
  }
  window.openAuth = function (mode) {
    var m = document.getElementById('authM');
    if (S.live) { toast('Customer login is coming soon. You can order as a guest.'); return; }
    var titles = { google: 'Continue with Google', login: 'Log in', signup: 'Create account', forgot: 'Forgot password' };
    m.innerHTML = '<div class="mbox"><button class="mx" onclick="closeAuth()">✕</button><h3 style="margin-top:0">' + titles[mode] + '</h3>' +
      (mode === 'google' ? '<p class="small">Choose your Gmail account (demo).</p><div class="field"><span>Gmail</span><input id="aMail" type="email" placeholder="yourname@gmail.com"></div><button class="btn" onclick="doAuth(\'google\')">Continue</button>'
        : mode === 'forgot' ? '<div class="field"><span>Email</span><input id="aMail" type="email"></div><button class="btn" onclick="doAuth(\'forgot\')">Send reset link</button><p class="small"><a href="#" onclick="openAuth(\'login\');return false" style="color:var(--c)">Back to log in</a></p>'
        : (mode === 'signup' ? '<div class="field"><span>' + t('fullName') + '</span><input id="aName"></div>' : '') + '<div class="field"><span>Email</span><input id="aMail" type="email" placeholder="name@gmail.com"></div><div class="field"><span>Password</span><input id="aPass" type="password" placeholder="At least 8 characters"></div><button class="btn" onclick="doAuth(\'' + mode + '\')">' + titles[mode] + '</button>' +
          '<p class="small" style="display:flex;justify-content:space-between"><a href="#" onclick="openAuth(\'forgot\');return false" style="color:var(--c)">Forgot password?</a><a href="#" onclick="openAuth(\'' + (mode === 'login' ? 'signup' : 'login') + '\');return false" style="color:var(--c)">' + (mode === 'login' ? 'Create account' : 'Log in') + '</a></p>') + '</div>';
    m.hidden = false;
  };
  window.roseInfo = function () {
    var C = window.ROSE_CONTACT, m = document.getElementById('authM');
    var wa = function (n) { return 'https://wa.me/880' + n.replace(/^0/, ''); };
    m.innerHTML = '<div class="mbox rosebox"><button class="mx" onclick="closeAuth()">✕</button>' +
      '<div style="text-align:center"><img src="/tiya-home.jpg?v=3" alt="ROSE" style="width:76px;height:76px;border-radius:99px;object-fit:cover;object-position:center 30%;border:3px solid #2dd4bf"><h3 style="margin:8px 0 2px">ROSE · ' + C.site + '</h3><p class="small" style="margin:0">This store is made with ROSE Store Builder. Want a store like this? Contact us.</p></div>' +
      C.phones.map(function (n) { return '<div class="rrow"><span>📞</span><b>' + n + '</b><a href="tel:' + n + '">Call</a><a class="wa" href="' + wa(n) + '" target="_blank" rel="noopener">WhatsApp</a></div>'; }).join('') +
      C.emails.map(function (e) { return '<div class="rrow"><span>✉️</span><b style="font-size:13px">' + e + '</b><a href="mailto:' + e + '">Email</a></div>'; }).join('') +
      '<a class="btn" style="margin-top:12px;padding:12px" href="https://www.myrosebd.com/demos" target="_blank" rel="noopener">Make my own store</a></div>';
    m.hidden = false;
  };
  window.closeAuth = function () { document.getElementById('authM').hidden = true; };
  window.doAuth = function (mode) {
    var g = function (x) { var e = document.getElementById(x); return e ? e.value.trim() : ''; };
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(g('aMail'))) return toast('Write a correct email');
    if (mode === 'forgot') { closeAuth(); return toast('Reset link sent to ' + g('aMail') + ' (demo)'); }
    if ((mode === 'login' || mode === 'signup') && g('aPass').length < 8) return toast('Password needs at least 8 characters');
    cust.email = g('aMail'); if (g('aName')) cust.name = g('aName'); saveCust(); closeAuth(); toast('Signed in (demo)'); route();
  };
  var PAGES = {
    about: ['About us', S.live ? S.name + ': ' + S.tagline : S.name + ' is a demo store made with ROSE Store Builder. A real store writes its own story here.'],
    contact: ['Contact', 'Phone, e-mail, address and map. Live chat is at the bottom right.'],
    return: ['Return policy', 'Example: return or exchange within 7 days with the invoice. Each store writes its own rules.'],
    privacy: ['Privacy policy', 'How the store uses customer data. ROSE gives every store a ready template.'],
    terms: ['Terms', 'Store terms and conditions.'],
  };

  window.route = function () {
    var h = decodeURIComponent((location.hash || '#/').slice(1));
    var v = document.getElementById('view'), html;
    if (h === '/' || h === '') html = home();
    else if (h === '/categories') html = '<div class="head"><h3>All categories</h3></div>' + catTiles(false);
    else if (h.indexOf('/c/') === 0) { var cat = h.slice(3); html = list(cat, P.filter(function (p) { return p.cat === cat; })); }
    else if (h === '/all') html = list('All products', P);
    else if (h.indexOf('/p/') === 0) { var p = P[+h.slice(3)]; html = p ? product(p) : list('Not found', []); }
    else if (h.indexOf('/s/') === 0) {
      var q = h.slice(3).toLowerCase(), ph = window.__photoHits; window.__photoHits = null;
      var words = q.split(/\s+/).filter(function (w) { return w.length > 1; });
      var found = ph && ph.length ? ph : P.filter(function (p) { var t = (p.name + ' ' + p.cat).toLowerCase(); return t.indexOf(q) >= 0 || (words.length > 1 && words.every(function (w) { return t.indexOf(w) >= 0; })); });
      if (!found.length) found = P.filter(function (p) { var t = (p.name + ' ' + p.cat).toLowerCase(); return words.some(function (w) { return w.length > 2 && t.indexOf(w) >= 0; }); });
      html = list('Search: ' + q, found);
    }
    else if (h === '/cart') html = cartPage();
    else if (h === '/checkout') html = checkout();
    else if (h === '/done') { var lo = myOrders()[0]; html = lo ? invoice(lo.no) : home(); }
    else if (h.indexOf('/invoice/') === 0) html = invoice(h.slice(9));
    else if (h === '/wishlist') { var w = P.filter(function (p) { return st.wish.indexOf(p.id) >= 0; }); html = w.length ? list('Wishlist', w) : '<div class="panel" style="text-align:center;padding:40px">🤍<h3>No saved items yet</h3></div>'; }
    else if (h === '/account') html = account();
    else if (h.indexOf('/page/') === 0) { var pg = PAGES[h.slice(6)] || PAGES.about; html = '<div class="panel"><h2 style="margin-top:0">' + pg[0] + '</h2><p>' + esc(pg[1]) + '</p></div>'; }
    else html = home();
    document.body.classList.remove('onp'); document.getElementById('buybar').innerHTML = ''; document.getElementById('authM').hidden = true; paintAcc();
    v.innerHTML = html;
    window.scrollTo(0, 0);
    renderNav();
    if (h === '/' || h === '') startSlider();
    if (h.indexOf('/p/') === 0 && P[+h.slice(3)]) bindProduct(+h.slice(3));
    if (h === '/checkout' && st.cart.length) bindCheckout();
  };
  window.toast = toast;
  document.getElementById('searchForm').onsubmit = function (e) { e.preventDefault(); var q = document.getElementById('q').value.trim(); if (q) location.hash = '#/s/' + encodeURIComponent(q); };
  window.addEventListener('hashchange', route);

  // search by photo (camera or gallery)
  var camFile = document.getElementById('camFile');
  document.getElementById('camBtn').onclick = function () { camFile.value = ''; camFile.click(); };
  camFile.onchange = function () {
    var f = camFile.files && camFile.files[0]; if (!f) return;
    toast('Looking at your photo…');
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var k = Math.min(1, 512 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      var b64 = c.toDataURL('image/jpeg', 0.7).split(',')[1];
      fetch(SB_URL + '/functions/v1/store-image-search', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY }, body: JSON.stringify({ image: b64, names: P.map(function (p) { return p.name; }) }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.query) throw new Error(j.error || 'Could not find it');
          var exact = P.find(function (p) { return p.name.toLowerCase() === j.query.toLowerCase(); });
          if (exact) { location.hash = '#/p/' + exact.id; return; }
          document.getElementById('q').value = j.query;
          var words = j.query.toLowerCase().split(/\s+/).filter(function (w) { return w.length > 2; });
          var hit = P.filter(function (p) { var t = (p.name + ' ' + p.cat).toLowerCase(); return words.some(function (w) { return t.indexOf(w) >= 0; }); });
          window.__photoHits = hit; location.hash = '#/s/' + encodeURIComponent(j.query);
        })
        .catch(function (e) { toast(e.message || 'Photo search failed'); });
    };
    img.onerror = function () { toast('Could not read that photo'); };
    img.src = url;
  };

  // live chat (demo answers)
  var chat = document.getElementById('chat'), cm = document.getElementById('chatM');
  document.getElementById('chatTitle').textContent = S.name + ' · Live chat';
  function say(t, who) { var d = document.createElement('div'); d.className = who; d.textContent = t; cm.appendChild(d); cm.scrollTop = 99999; }
  say('Hi! I am ROSE, the assistant of ' + S.name + '. Ask about price, stock or delivery.', 'b');
  document.getElementById('chatBtn').onclick = function () { chat.classList.toggle('on'); };
  document.getElementById('chatX').onclick = function () { chat.classList.remove('on'); };
  document.getElementById('chatF').onsubmit = function (e) {
    e.preventDefault();
    var i = document.getElementById('chatI'), t = i.value.trim(); if (!t) return; i.value = ''; say(t, 'u');
    var l = t.toLowerCase(), hit = P.find(function (p) { return l.indexOf(p.name.toLowerCase().split(' ')[0]) >= 0; });
    var a = hit ? hit.name + ' is ' + tk(hit.price) + ' (was ' + tk(hit.old) + ') and in stock.'
      : /deliver|ডেলিভারি|charge/.test(l) ? 'Delivery: ৳ 60 inside Dhaka, ৳ 120 outside. ' + S.note
      : /dose|ডোজ|খাব/.test(l) && S.pharmacy ? 'For dose, please ask your doctor or our pharmacist. I can help you order.'
      : S.live ? 'Thanks! Please call ' + (S.phone || 'the shop') + ' or place the order, the shop will contact you.' : 'Thanks! In a real store the owner gets this message in the ROSE app at once and can reply.';
    setTimeout(function () { say(a, 'b'); }, 600);
  };

  counts(); route();
}
</script>
<script>
(function () {
  try {
    fetch(SB_URL + '/rest/v1/site_settings?key=eq.store_footer_made_with_rose&select=value', { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        if (rows && rows[0] && rows[0].value === false) {
          var st = document.createElement('style'); st.textContent = '.made-rose{display:none!important}'; document.head.appendChild(st);
        }
      }).catch(function () {});
  } catch (e) {}
})();
</script>
</body>
