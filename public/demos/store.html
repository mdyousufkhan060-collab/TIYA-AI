    else if (h === '/offers') html = offersPage();
    else if (h === '/account') html = account();
    else if (h.indexOf('/account/') === 0) html = accSub(h.slice(9));
    else if (h.indexOf('/page/') === 0) { var pg = PAGES[h.slice(6)] || PAGES.about; html = '<div class="panel"><h2 style="margin-top:0">' + pg[0] + '</h2><p>' + esc(pg[1]) + '</p></div>'; }
    else html = home();
    document.body.classList.remove('onp'); document.getElementById('buybar').innerHTML = ''; document.getElementById('authM').hidden = true; paintAcc();
    v.innerHTML = html;
    window.scrollTo(0, 0);
    renderNav();
    if (h === '/' || h === '') startSlider();
    bindMore();
    if (h.indexOf('/p/') === 0 && P[+h.slice(3)]) bindProduct(+h.slice(3));
    if (h === '/checkout' && st.cart.length) bindCheckout();
  };
  window.toast = toast;
  document.addEventListener('gesturestart', function (e) { if (!document.getElementById('zoomV')) e.preventDefault(); });
  document.getElementById('searchForm').onsubmit = function (e) { e.preventDefault(); var q = document.getElementById('q').value.trim(); if (q) location.hash = '#/s/' + encodeURIComponent(q); };
  window.addEventListener('hashchange', route);

  // search by photo (camera or gallery)
  var camFile = document.getElementById('camFile');
  document.getElementById('camBtn').onclick = function () { camFile.value = ''; camFile.click(); };
  camFile.onchange = function () {
    var f = camFile.files && camFile.files[0]; if (!f) return;
    toast('Looking at your photo…');
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var k = Math.min(1, 512 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      var b64 = c.toDataURL('image/jpeg', 0.7).split(',')[1];
      fetch(SB_URL + '/functions/v1/store-image-search', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY }, body: JSON.stringify({ image: b64, names: P.map(function (p) { return p.name; }) }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.query) throw new Error(j.error || 'Could not find it');
          var exact = P.find(function (p) { return p.name.toLowerCase() === j.query.toLowerCase(); });
          if (exact) { location.hash = '#/p/' + exact.id; return; }
          document.getElementById('q').value = j.query;
          var words = j.query.toLowerCase().split(/\s+/).filter(function (w) { return w.length > 2; });
          var hit = P.filter(function (p) { var t = (p.name + ' ' + p.cat).toLowerCase(); return words.some(function (w) { return t.indexOf(w) >= 0; }); });
          window.__photoHits = hit; location.hash = '#/s/' + encodeURIComponent(j.query);
        })
        .catch(function (e) { toast(e.message || 'Photo search failed'); });
    };
    img.onerror = function () { toast('Could not read that photo'); };
    img.src = url;
  };

  // live chat (demo answers)
  // ---------------- live chat (ROSE answers for ROSE Business shops and in demos) ----------------
  var chat = document.getElementById('chat'), cm = document.getElementById('chatM');
  var CHAT_URL = SB_URL + '/functions/v1/rose-chat', VKEY = 'rose_chat_v', vis;
  try { vis = localStorage.getItem(VKEY); } catch (e) {}
  if (!vis) { vis = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); try { localStorage.setItem(VKEY, vis); } catch (e) {} }
  var chatAI = !S.live, lastAt = '', seen = {}, pollT = 0, typing = null;
  var demoInfo = function () { return 'Shop type: ' + S.type + '. ' + (S.note || '') + ' Delivery ' + DIN + ' Tk inside Dhaka, ' + DOUT + ' Tk outside. Products: ' + P.slice(0, 60).map(function (p) { return p.name + ' ' + p.price + ' Tk' + (off(p) ? ' (was ' + p.old + ')' : ''); }).join('; '); };
  var chatBody = function (extra) { var b = { visitor: vis }; if (S.live) b.slug = S.slug; else { b.demo = id; b.name = S.name; b.info = demoInfo(); } for (var k in extra) b[k] = extra[k]; return b; };
  var chatCall = function (extra) { return fetch(CHAT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }, body: JSON.stringify(chatBody(extra)) }).then(function (r) { return r.json(); }); };
  document.getElementById('chatTitle').textContent = S.name;
  document.getElementById('chatLogo').innerHTML = S.logoUrl ? '<img src="' + esc(S.logoUrl) + '" alt="">' : S.logo;
  function chatSub() { document.getElementById('chatSub').textContent = chatAI ? (LANG === 'bn' ? '🌹 ROSE AI · সাথে সাথে উত্তর' : '🌹 ROSE AI · replies at once') : (LANG === 'bn' ? 'সাধারণত দ্রুত উত্তর দেয়' : 'Usually replies soon'); }
  function say(t, who, label) {
    if (label) { var w = document.createElement('div'); w.className = 'who'; w.textContent = label; cm.appendChild(w); }
    var d = document.createElement('div'); d.className = who; d.textContent = t; cm.appendChild(d); cm.scrollTop = 99999; return d;
  }
  function showMsgs(list) {
    (list || []).forEach(function (m) {
      if (seen[m.id]) return; seen[m.id] = 1; lastAt = m.created_at;
      if (m.sender === 'customer') say(m.body, 'u'); else say(m.body, 'b', m.sender === 'rose' ? '🌹 ROSE' : S.name);
    });
  }
  var hello = function () { return LANG === 'bn' ? 'হ্যালো! 👋 ' + S.name + '-এ স্বাগতম। দাম, স্টক, ডেলিভারি বা অর্ডার নিয়ে যা জানতে চান লিখুন।' : 'Hi! 👋 Welcome to ' + S.name + '. Ask me about price, stock, delivery or your order.'; };
  var opened = false;
  function openChat() {
    chat.classList.add('on'); chatSub();
    if (!opened) {
      opened = true; say(hello(), 'b', chatAI ? '🌹 ROSE' : S.name);
      chatCall({ action: 'info' }).then(function (r) { if (r && typeof r.ai === 'boolean') { chatAI = r.ai; chatSub(); } }).catch(function () {});
      chatCall({ action: 'poll', after: '' }).then(function (r) { showMsgs(r && r.messages); }).catch(function () {});
    }
    clearInterval(pollT);
    if (S.live) pollT = setInterval(function () { if (!chat.classList.contains('on')) return clearInterval(pollT); chatCall({ action: 'poll', after: lastAt }).then(function (r) { showMsgs(r && r.messages); }).catch(function () {}); }, 7000);
  }
  document.getElementById('chatBtn').onclick = function () { if (chat.classList.contains('on')) chat.classList.remove('on'); else openChat(); };
  document.getElementById('chatX').onclick = function () { chat.classList.remove('on'); };
  document.getElementById('chatF').onsubmit = function (e) {
    e.preventDefault();
    var i = document.getElementById('chatI'), t = i.value.trim(); if (!t) return; i.value = '';
    var mine = say(t, 'u');
    var bn = /[ঀ-৿]/.test(t);
    if (chatAI) { typing = say('• • •', 'b ty'); }
    chatCall({ action: 'send', text: t }).then(function (r) {
      if (typing) { typing.remove(); typing = null; }
      if (r && r.error) return say(r.error, 'b');
      if (r && r.reply) { seen[r.reply.id] = 1; lastAt = r.reply.created_at; say(r.reply.body, 'b', '🌹 ROSE'); }
      else if (r && r.ai === false) say(bn ? 'ধন্যবাদ! আপনার মেসেজ দোকানে পৌঁছেছে, খুব শিগগির উত্তর দেওয়া হবে।' + (S.whatsapp || S.phone ? ' জরুরি হলে WhatsApp: ' + (S.whatsapp || S.phone) : '') : 'Thanks! The shop got your message and will reply soon.' + (S.whatsapp || S.phone ? ' Urgent? WhatsApp ' + (S.whatsapp || S.phone) : ''), 'b', S.name);
    }).catch(function () {
      if (typing) { typing.remove(); typing = null; }
      say(bn ? 'এখন পাঠানো গেল না। ইন্টারনেট দেখে আবার চেষ্টা করুন।' : 'Could not send now. Check the internet and try again.', 'b');
    });
    mine.title = new Date().toLocaleTimeString();
  };

  counts(); route();
}
</script>
<script>
(function () {
  try {
    fetch(SB_URL + '/rest/v1/site_settings?key=eq.store_footer_made_with_rose&select=value', { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        if (rows && rows[0] && rows[0].value === false) {
          var st = document.createElement('style'); st.textContent = '.made-rose{display:none!important}'; document.head.appendChild(st);
        }
      }).catch(function () {});
  } catch (e) {}
})();
</script>
