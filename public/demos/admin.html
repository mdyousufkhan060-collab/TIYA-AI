<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Demo Store Admin · ROSE Store Builder</title>
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; }
  html { scrollbar-width: none; } html::-webkit-scrollbar { display: none; }
  body { margin: 0; background: #070b14; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .demo { background: #facc15; color: #111; font-size: 12px; font-weight: 700; text-align: center; padding: 6px 10px; }
  header { position: sticky; top: 0; z-index: 10; background: #0b1120; border-bottom: 1px solid #1e293b; }
  .hb { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .hb .back { color: #2dd4bf; font-weight: 800; font-size: 13px; min-width: 70px; }
  .hb b { flex: 1; text-align: center; letter-spacing: .08em; font-size: 14px; }
  .hb a.store { font-size: 12px; border: 1px solid #334155; border-radius: 9px; padding: 6px 10px; }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 14px; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
  .side { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow-y: auto; scrollbar-width: none; }
  .card { background: #11151e; border: 1px solid #1e293b; border-radius: 14px; padding: 12px; }
  .bar { width: 100%; display: flex; align-items: center; gap: 10px; height: 50px; border-radius: 12px; border: 1px solid #1e293b; background: #11151e; color: #e2e8f0; padding: 0 10px; margin-bottom: 6px; text-align: left; transition: border-color .2s, background .2s; }
  .bar:hover { background: #151b27; }
  .bar.on { border-color: #14b8a6; background: #0f1f24; }
  .bar .n { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; color: #2dd4bf; background: #1e293b; border-radius: 6px; padding: 3px 6px; }
  .bar .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
  .bar .t { flex: 1; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .bar .v { font-size: 10.5px; color: #94a3b8; }
  .bar .chev { color: #475569; font-size: 16px; }
  .store { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .store img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  .pill { display: inline-block; border-radius: 6px; padding: 2px 7px; font-size: 10.5px; font-weight: 800; color: #fff; }
  .live { background: #059669; }
  h2 { margin: 0 0 12px; font-size: 16px; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat b { display: block; font-size: 22px; color: #fff; }
  .stat small { color: #94a3b8; font-size: 11px; letter-spacing: .06em; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin-top: 8px; }
  .chart div { flex: 1; background: linear-gradient(#2dd4bf, #0e7490); border-radius: 6px 6px 0 0; position: relative; }
  .chart div span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: #64748b; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
  .row.click { cursor: pointer; border-radius: 10px; }
  .row.click:hover { background: #151b27; }
  .row:last-child { border-bottom: 0; }
  .row img, .row .ph { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; flex-shrink: 0; display: grid; place-items: center; font-size: 26px; background: #0a0f1a; }
  .row .f { flex: 1; min-width: 0; }
  .row .f p { margin: 2px 0 0; color: #94a3b8; font-size: 11.5px; }
  .st { font-size: 10px; font-weight: 800; border-radius: 6px; padding: 3px 7px; color: #fff; white-space: nowrap; }
  .s-new { background: #2563eb; } .s-confirmed { background: #7c3aed; } .s-packed { background: #0891b2; } .s-shipped { background: #d97706; } .s-delivered { background: #059669; } .s-cancelled { background: #dc2626; } .s-returned { background: #6b7280; }
  .btn { background: #14b8a6; color: #021014; border: 0; border-radius: 10px; padding: 9px 12px; font-weight: 800; font-size: 12px; }
  .btn.alt { background: transparent; color: #e2e8f0; border: 1px solid #334155; }
  .btn.red { background: #dc2626; color: #fff; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; color: #94a3b8; }
  .field input, .field select, .field textarea { background: #0a0f1a; border: 1px solid #334155; border-radius: 10px; color: #fff; padding: 10px; font-size: 13px; font-family: inherit; }
  .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
  .field input, .field select, .field textarea { width: 100%; min-width: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { border: 1px solid #334155; background: transparent; color: #e2e8f0; border-radius: 99px; padding: 6px 11px; font-size: 11px; font-weight: 700; }
  .tabs button.on { background: #14b8a6; color: #021014; border-color: #14b8a6; }
  .tabs button i { font-style: normal; opacity: .7; margin-left: 3px; }
  .chat { display: flex; flex-direction: column; gap: 6px; font-size: 13px; max-height: 340px; overflow-y: auto; }
  .chat div { max-width: 80%; padding: 8px 10px; border-radius: 12px; }
  .chat .c { background: #1e293b; align-self: flex-start; }
  .chat .r { background: #0f766e; align-self: flex-end; }
  .chat .o { background: #7c3aed; align-self: flex-end; }
  .note { font-size: 12px; color: #94a3b8; margin-top: 10px; line-height: 1.5; }
  .toggle { width: 44px; height: 24px; border-radius: 99px; background: #334155; position: relative; border: 0; flex-shrink: 0; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: #fff; transition: left .2s; }
  .toggle.on { background: #14b8a6; } .toggle.on::after { left: 23px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  .thumbs img, .thumbs span { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #0a0f1a; display: grid; place-items: center; font-size: 28px; border: 1px dashed #334155; }
  .preview { background: #fff; color: #0f172a; border-radius: 14px; overflow: hidden; }
  .preview img { width: 100%; height: 220px; object-fit: cover; display: block; }
  .preview .b { padding: 12px; }
  .seo { background: #fff; color: #1a0dab; border-radius: 10px; padding: 10px; font-size: 13px; }
  .seo small { color: #006621; display: block; } .seo p { color: #4d5156; margin: 4px 0 0; font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #14b8a6; color: #021014; font-weight: 800; padding: 9px 16px; border-radius: 99px; font-size: 13px; display: none; z-index: 50; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; max-height: none; }
    body.inview .side { display: none; }
    body:not(.inview) .main { display: none; }
    .grid4 { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="demo">DEMO ADMIN · works like the real one · nothing is saved</div>
<header><div class="hb"><a class="back" id="back" href="/demos">‹ Demos</a><b id="title">STORE ADMIN</b><a class="store" id="storeLink" href="#">View store</a></div></header>
<div class="wrap"><div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"></main></div></div>
<div class="toast" id="toast"></div>
<script src="/demos/stores.js"></script>
<script>
(function () {
  var k = new URLSearchParams(location.search).get('s') || 'fashionhub';
  var S = window.ROSE_STORES[k] || window.ROSE_STORES.fashionhub;
  var IMG = function (id, w) { return id ? (/^https?:|^blob:/.test(id) ? id : window.ROSE_IMG(id, w || 300)) : ''; };
  var tk = function (n) { return '৳ ' + Math.round(n).toLocaleString('en-IN'); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function toast(t) { var e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 1700); }
  document.getElementById('storeLink').href = '/demos/store.html?s=' + k;
  document.title = S.name + ' Admin (demo)';

  // ---------------- demo state (lives only in this tab) ----------------
  var st = {
    products: S.products.map(function (p, i) {
      return { id: i, name: p[0], cat: p[1], e: p[2], price: p[3], old: p[4], rx: p[5] === 'rx', imgs: p[6] ? [p[6]] : [], stock: [24, 8, 3, 40, 15, 0, 12, 31, 6, 19, 22, 5][i % 12], active: true,
        desc: p[0] + ' from ' + S.name + '. Best quality, checked before delivery. ' + (S.note || ''), opts: S.options ? S.options.values.slice() : [], optLabel: S.options ? S.options.label : '' };
    }),
    cats: S.categories.map(function (c) { return { name: c[0], icon: c[1] }; }),
    coupons: [{ code: 'ROSE10', text: '10% off, min 1,000 Tk', on: true }, { code: 'FREESHIP', text: 'Free delivery over 1,500 Tk', on: true }, { code: 'EID500', text: '500 Tk off, min 5,000 Tk', on: false }],
    pay: [['Cash on Delivery', true], ['bKash (Send Money + TrxID)', true], ['Nagad', true], ['Rocket', false], ['Bank transfer', false]],
    couriers: [['Steadfast', true], ['Pathao', false], ['RedX', false]],
    staff: [['rahim.staff@gmail.com', 'ORDER STAFF'], ['mitu.design@gmail.com', 'PRODUCT STAFF']],
    banners: S.banners.map(function (b) { return { title: b.title, badge: b.badge, img: b.img }; }),
    chats: [], takeover: false,
  };
  var names = ['Rahim U.', 'Nusrat J.', 'Tanvir A.', 'Sadia R.', 'Kamal H.', 'Mitu K.', 'Arif B.', 'Lima S.'];
  var areas = ['Mirpur, Dhaka', 'Uttara, Dhaka', 'Chattogram', 'Dhanmondi, Dhaka', 'Sylhet', 'Gazipur', 'Khulna', 'Banani, Dhaka'];
  var stat0 = ['new', 'new', 'confirmed', 'packed', 'shipped', 'delivered', 'delivered', 'cancelled'];
  st.orders = names.map(function (n, i) {
    var p = st.products[i % st.products.length], q = 1 + (i % 2), del = /Dhaka/.test(areas[i]) ? 60 : 120;
    return { no: 1024 - i, name: n, phone: '01' + (7 + (i % 3)) + '1234567' + i, area: areas[i], items: [{ p: p.id, q: q }], del: del, total: p.price * q + del,
      pay: i % 3 ? 'COD' : 'bKash', trx: i % 3 ? '' : 'BK7' + (3920 + i) + 'XQ', st: stat0[i], time: (i * 37 + 9) + ' min ago', history: i === 7 ? '3 orders, 2 returned' : (i + 1) + ' orders, 0 returned', track: '' };
  });
  st.reviews = st.products.slice(0, 4).map(function (p, i) { return { p: p.id, who: names[i], stars: i % 2 ? 4 : 5, text: ['Good quality, fast delivery.', 'Exactly as shown. Will order again.', 'Packing was nice, thanks!', 'Price is fair.'][i], reply: '', hidden: false }; });
  var P = function (id) { return st.products[id]; };
  var thumb = function (p) { return p && p.imgs[0] ? '<img src="' + IMG(p.imgs[0], 160) + '" alt="">' : '<span class="ph">' + (p ? p.e : '📦') + '</span>'; };
  var row = function (img, title, sub, right, click) { return '<div class="row' + (click ? ' click" onclick="' + click : '') + '">' + img + '<div class="f"><b>' + title + '</b><p>' + sub + '</p></div>' + (right || '') + '</div>'; };
  var btn = function (t, fn, cls) { return '<button class="btn ' + (cls || '') + '" onclick="' + fn + '">' + t + '</button>'; };
  var STATUSES = ['new', 'confirmed', 'packed', 'shipped', 'delivered', 'cancelled', 'returned'];

  // ---------------- bars ----------------
  var BARS = [
    ['dashboard', 'DASHBOARD', '📊', '#1d4ed8', function () { return 'TODAY'; }],
    ['orders', 'ORDERS', '🧾', '#7c3aed', function () { return st.orders.filter(function (o) { return o.st === 'new'; }).length + ' NEW'; }],
    ['products', 'PRODUCTS', '📦', '#0d9488', function () { return st.products.length + ' ITEMS'; }],
    ['categories', 'CATEGORIES', '🗂️', '#ca8a04', function () { return st.cats.length; }],
    ['design', 'HOMEPAGE & DESIGN', '🎨', '#db2777', function () { return 'BANNERS'; }],
    ['customers', 'CUSTOMERS', '👥', '#2563eb', function () { return '312'; }],
    ['offers', 'OFFERS & COUPONS', '🏷️', '#ea580c', function () { return st.coupons.filter(function (c) { return c.on; }).length + ' ACTIVE'; }],
    ['reviews', 'REVIEWS', '⭐', '#eab308', function () { return '4.6 ★'; }],
    ['chat', 'LIVE CHAT', '💬', '#059669', function () { return st.takeover ? 'YOU' : 'ROSE'; }],
    ['payments', 'PAYMENTS', '💳', '#4f46e5', function () { return st.pay.filter(function (p) { return p[1]; }).length + ' ON'; }],
    ['delivery', 'DELIVERY', '🚚', '#b45309', function () { return '60 / 120 TK'; }],
    ['pixels', 'TRACKING & PIXELS', '📈', '#0284c7', function () { return 'ADS'; }],
    ['seo', 'SEO', '🔍', '#16a34a', function () { return '82 / 100'; }],
    ['staff', 'STAFF', '👤', '#9333ea', function () { return st.staff.length + ' / 3'; }],
    ['domain', 'DOMAIN', '🌐', '#0891b2', function () { return 'LINK'; }],
    ['reports', 'REPORTS', '📑', '#64748b', function () { return 'MONTH'; }],
  ];
  var barOf = function (id) { return BARS.filter(function (b) { return b[0] === id; })[0]; };

  // ---------------- views ----------------
  var V = {};
  V.dashboard = function () {
    var today = st.orders.filter(function (o) { return o.st !== 'cancelled'; });
    var days = ['Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed'];
    var bars = [40, 65, 52, 80, 70, 95, 88].map(function (h, i) { return '<div style="height:' + h + '%" title="' + tk(h * 410) + '"><span>' + days[i] + '</span></div>'; }).join('');
    return '<div class="grid4">' + [[today.length, 'ORDERS TODAY', 'orders'], [tk(today.reduce(function (a, o) { return a + o.total; }, 0)), 'SALES TODAY', 'reports'], ['1,240', 'VISITORS', 'pixels'], ['3.2%', 'CONVERSION', 'reports']].map(function (x) {
      return '<div class="card stat" style="cursor:pointer" onclick="go(\'' + x[2] + '\')"><b>' + x[0] + '</b><small>' + x[1] + '</small></div>'; }).join('') + '</div>' +
      '<div class="card" style="margin-top:10px;padding-bottom:26px"><b style="font-size:13px">SALES · LAST 7 DAYS</b><div class="chart">' + bars + '</div></div>' +
      '<div class="card" style="margin-top:10px"><b style="font-size:13px">NEW ORDERS</b>' + st.orders.filter(function (o) { return o.st === 'new'; }).map(orderRow).join('') + '</div>' +
      '<div class="card" style="margin-top:10px"><b style="font-size:13px">LOW STOCK</b>' + st.products.filter(function (p) { return p.stock < 7; }).map(function (p) {
        return row(thumb(p), esc(p.name), p.stock ? 'Only ' + p.stock + ' left' : 'Out of stock', btn('+10', 'restock(' + p.id + ')', 'alt'));
      }).join('') + '</div>';
  };
  function orderRow(o) {
    var p = P(o.items[0].p);
    return row(thumb(p), '#' + o.no + ' · ' + tk(o.total), esc(o.name) + ' · ' + o.area + '<br>' + esc(p.name) + ' ×' + o.items[0].q + ' · ' + o.pay + ' · ' + o.time, '<span class="st s-' + o.st + '">' + o.st.toUpperCase() + '</span>', "go('order/" + o.no + "')");
  }
  var orderFilter = 'all';
  V.orders = function () {
    var count = function (s) { return st.orders.filter(function (o) { return s === 'all' || o.st === s; }).length; };
    var list = st.orders.filter(function (o) { return orderFilter === 'all' || o.st === orderFilter; });
    return '<div class="tabs">' + ['all', 'new', 'confirmed', 'packed', 'shipped', 'delivered', 'cancelled'].map(function (s) {
      return '<button class="' + (orderFilter === s ? 'on' : '') + '" onclick="setOrderFilter(\'' + s + '\')">' + s.toUpperCase() + '<i>' + count(s) + '</i></button>'; }).join('') + '</div>' +
      '<div class="card">' + (list.length ? list.map(orderRow).join('') : '<p class="note">No orders here.</p>') + '</div><p class="note">Tap an order to open it: confirm, book courier, print invoice, call the customer.</p>';
  };
  V.order = function (no) {
    var o = st.orders.filter(function (x) { return x.no === +no; })[0]; if (!o) return '<p class="note">Not found.</p>';
    var p = P(o.items[0].p), sub = p.price * o.items[0].q;
    var risky = /returned/.test(o.history) && !/0 returned/.test(o.history);
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">#' + o.no + '</b><span class="st s-' + o.st + '">' + o.st.toUpperCase() + '</span></div>' +
      '<p class="note" style="margin-top:4px">' + o.time + ' · paid by ' + o.pay + (o.trx ? ' · TrxID ' + o.trx : '') + '</p>' +
      row(thumb(p), esc(p.name) + ' ×' + o.items[0].q, tk(p.price) + ' each', '<b>' + tk(sub) + '</b>') +
      '<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:8px"><span>Delivery</span><b>' + tk(o.del) + '</b></div><div style="display:flex;justify-content:space-between;font-size:15px;margin-top:4px"><span>Total</span><b style="color:#2dd4bf">' + tk(o.total) + '</b></div></div>' +
      '<div class="card" style="margin-top:10px"><b style="font-size:13px">CUSTOMER</b><p style="margin:6px 0 0">' + esc(o.name) + ' · <a href="tel:' + o.phone + '" style="color:#2dd4bf">' + o.phone + '</a></p><p class="note" style="margin-top:2px">' + o.area + '</p>' +
      '<p class="note" style="margin-top:6px">Courier history: <b style="color:' + (risky ? '#f87171' : '#34d399') + '">' + o.history + '</b>' + (risky ? ' · ask for advance payment' : ' · safe for COD') + '</p></div>' +
      '<div class="card" style="margin-top:10px"><b style="font-size:13px">CHANGE STATUS</b><div class="tabs" style="margin-top:8px">' + STATUSES.map(function (s) { return '<button class="' + (o.st === s ? 'on' : '') + '" onclick="setStatus(' + o.no + ',\'' + s + '\')">' + s.toUpperCase() + '</button>'; }).join('') + '</div>' +
      (o.track ? '<p class="note">Courier: ' + o.track + '</p>' : '') +
      '<div class="btns">' + btn('🚚 Book Steadfast', 'book(' + o.no + ',\'Steadfast\')') + btn('Book Pathao', 'book(' + o.no + ',\'Pathao\')', 'alt') + btn('🖨️ Invoice', 'invoice(' + o.no + ')', 'alt') + btn('📞 Call', 'toast(\'Calling ' + o.phone + '…\')', 'alt') + btn('WhatsApp', 'toast(\'WhatsApp opened with the order message\')', 'alt') + '</div></div>';
  };
  var prodFilter = 'all';
  V.products = function () {
    var list = st.products.filter(function (p) { return prodFilter === 'all' || p.cat === prodFilter; });
    return '<div class="btns" style="margin:0 0 10px">' + btn('+ ADD PRODUCT', "go('product/new')") + btn('📥 Bulk upload (Excel)', "toast('Choose an Excel file: name, price, stock, category, photo link')", 'alt') + '</div>' +
      '<div class="tabs"><button class="' + (prodFilter === 'all' ? 'on' : '') + '" onclick="setProdFilter(\'all\')">ALL</button>' + st.cats.map(function (c) { return '<button class="' + (prodFilter === c.name ? 'on' : '') + '" onclick="setProdFilter(\'' + esc(c.name).replace(/'/g, '') + '\')">' + c.icon + ' ' + esc(c.name) + '</button>'; }).join('') + '</div>' +
      '<div class="card">' + list.map(function (p) {
        return row(thumb(p), esc(p.name) + (p.rx ? ' <span class="pill" style="background:#0e7490">Rx</span>' : '') + (p.active ? '' : ' <span class="pill" style="background:#475569">HIDDEN</span>'),
          tk(p.price) + (p.old > p.price ? ' <s>' + tk(p.old) + '</s>' : '') + ' · ' + esc(p.cat) + ' · stock ' + p.stock, '<span class="chev">›</span>', "go('product/" + p.id + "')");
      }).join('') + '</div>';
  };
  V.product = function (id) {
    var isNew = id === 'new';
    var p = isNew ? { id: -1, name: '', cat: st.cats[0] ? st.cats[0].name : '', e: '📦', price: '', old: '', stock: 10, imgs: [], active: true, desc: '', opts: [], optLabel: '' } : P(+id);
    if (!p) return '<p class="note">Not found.</p>';
    var off = p.old > p.price ? Math.round((1 - p.price / p.old) * 100) : 0;
    return '<div class="layoutp" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px">' +
      '<div class="card"><b style="font-size:13px">' + (isNew ? 'ADD PRODUCT' : 'EDIT PRODUCT') + '</b>' +

      return '<button class="bar' + (b[0] === barId ? ' on' : '') + '" onclick="go(\'' + b[0] + '\')"><span class="n">' + String(j + 1).padStart(2, '0') + '</span><span class="ic" style="background:' + b[3] + '22;border:1px solid ' + b[3] + '55">' + b[2] + '</span><span class="t">' + b[1] + '</span><span class="v">' + b[4]() + '</span><span class="chev">›</span></button>';
    }).join('');
    var bar = barOf(barId);
    if (!bar) { main.innerHTML = ''; return; }
    var t = id === 'order' ? 'ORDER #' + arg : id === 'product' ? (arg === 'new' ? 'ADD PRODUCT' : 'PRODUCT') : bar[1];
    document.getElementById('title').textContent = t;
    var backTo = id === 'order' ? 'orders' : id === 'product' ? 'products' : '';
    main.innerHTML = '<h2>' + (backTo ? '<button class="btn alt" style="padding:5px 9px" onclick="go(\'' + backTo + '\')">‹</button>' : '') + '<span class="ic" style="font-size:20px">' + bar[2] + '</span>' + t + '</h2>' + (V[id] ? V[id](arg) : '');
  }
  window.render = render;
  function onHash() {
    route = decodeURIComponent(location.hash.slice(1));
    var mobile = window.innerWidth <= 820;
    if (!route && !mobile) route = 'dashboard';
    document.body.classList.toggle('inview', Boolean(route));
    var back = document.getElementById('back');
    if (route && mobile) { back.textContent = '‹ Back'; back.href = '#'; back.onclick = function (e) { e.preventDefault(); history.back(); }; }
    else { back.textContent = '‹ Demos'; back.href = '/demos'; back.onclick = null; if (!route) document.getElementById('title').textContent = 'STORE ADMIN'; }
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', onHash);
  onHash();
})();
</script>
