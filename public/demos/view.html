<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mobile & Desktop preview · ROSE Store Builder</title>
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #030814; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #1e293b; }
  .top b { font-size: 16px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button, .top a.btn { border: 1px solid #334155; background: transparent; color: #e2e8f0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .tabs button.on { background: #14b8a6; border-color: #14b8a6; color: #021014; }
  .stage { display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding: 22px 12px 40px; flex-wrap: wrap; }
  .dev { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dev small { color: #94a3b8; font-size: 12px; letter-spacing: .1em; }
  .phone { width: 390px; height: 800px; border: 12px solid #111827; border-radius: 42px; overflow: hidden; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .phone iframe { width: 100%; height: 100%; border: 0; }
  .desk { width: 900px; }
  .screen { width: 900px; height: 562px; border: 10px solid #111827; border-bottom-width: 18px; border-radius: 14px; overflow: hidden; background: #fff; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .screen iframe { width: 1440px; height: 900px; border: 0; transform-origin: 0 0; position: absolute; top: 0; left: 0; }
  .stand { width: 180px; height: 26px; margin: 0 auto; background: linear-gradient(#1f2937, #0b1220); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  body.m .desk, body.d .phonewrap { display: none; }
  @media (max-width: 1360px) { .desk, .screen { width: 640px; } .screen { height: 400px; } }
  @media (max-width: 720px) { .desk, .screen { width: 340px; } .screen { height: 213px; } .phone { width: 330px; height: 680px; } }
</style>
</head>
<body>
  <div class="top">
    <b id="title">Preview</b>
    <div class="tabs">
      <button data-v="both" class="on">MOBILE + DESKTOP</button>
      <button data-v="m">MOBILE</button>
      <button data-v="d">DESKTOP</button>
    </div>
    <div class="tabs"><a class="btn" href="/demos">‹ ALL DEMOS</a><a class="btn" id="adm" href="#">⚙️ ADMIN</a><a class="btn" id="open" href="#">OPEN FULL</a></div>
  </div>
  <div class="stage">
    <div class="dev phonewrap"><small>MOBILE</small><div class="phone"><iframe id="fm" title="Mobile preview"></iframe></div></div>
    <div class="dev desk"><small>DESKTOP</small><div class="screen"><iframe id="fd" title="Desktop preview"></iframe></div><div class="stand"></div></div>
  </div>
<script src="/demos/stores.js"></script>
<script>
  var q = new URLSearchParams(location.search), k = q.get('s') || 'foodbazaar', st = q.get('store');
  var url = st ? '/shop/' + encodeURIComponent(st) : '/demos/store.html?s=' + encodeURIComponent(k);
  var S = (window.ROSE_STORES || {})[k];
  document.getElementById('title').textContent = st ? st : S ? S.name + ' · ' + S.type : 'Preview';
  document.getElementById('fm').src = url;
  document.getElementById('fd').src = url;
  document.getElementById('open').href = url;
  document.getElementById('adm').href = '/demos/admin.html?s=' + encodeURIComponent(k);
  [].forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.onclick = function () {
      [].forEach.call(document.querySelectorAll('.tabs button'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      document.body.className = b.dataset.v === 'both' ? '' : b.dataset.v;
      fit();
    };
  });
  // Scale the 1440px desktop page to the inside of the monitor frame, so the bottom bar and chat button stay in view.
  function fit() {
    var sc = document.querySelector('.screen'), f = document.getElementById('fd');
    if (!sc || !sc.clientWidth) return;
    var k = sc.clientWidth / 1440;
    f.style.transform = 'scale(' + k + ')';
    f.style.height = Math.round(sc.clientHeight / k) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
